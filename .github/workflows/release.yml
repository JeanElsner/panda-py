name: Release

on:
  release:
    types: [published]

permissions: write-all

jobs:
  # bin/build.sh names the archives after the version in pyproject.toml, so read
  # it from there rather than repeating it here, where the two would drift.
  version:
    name: "Resolve package version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: resolve
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pyproject.toml", "rb") as f:
              raw = tomllib.load(f)["project"]["version"]
          # Strip any local version label, matching bin/build.sh.
          major, minor, micro = raw.split("+")[0].split(".")[:3]
          print(f"version={major}.{minor}.{micro}")
          PY
      - name: Show resolved version
        run: echo "Release artifacts will be named for ${{ steps.resolve.outputs.version }}"

  build_wheels:
    name: Build wheels for libfranka ${{ matrix.libfranka-version }}
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        libfranka-version: ["0.7.1", "0.8.0", "0.9.2", "0.12.1", "0.13.6", "0.14.2", "0.15.0", "0.21.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Use the prebuilt build environment
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "CIBW_MANYLINUX_X86_64_IMAGE=ghcr.io/$owner/panda-py-build:${{ matrix.libfranka-version }}" >> "$GITHUB_ENV"
          echo "CIBW_BEFORE_ALL=" >> "$GITHUB_ENV"
      - name: Build using cibuildwheel
        run: ./bin/build.sh "${{ matrix.libfranka-version }}"
      - uses: actions/upload-artifact@v4
        with:
          path: ./archive/panda_py_${{ needs.version.outputs.version }}_libfranka_${{ matrix.libfranka-version }}.zip
          name: zip-${{ matrix.libfranka-version }}
  upload_pypi:
    name: "Upload wheels to pypi"
    needs: [build_wheels]
    runs-on: ubuntu-latest
    env:
      LIBFRANKA_VER: "0.9.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: |
          ./bin/before_install_ubuntu.sh
          python -m pip install cibuildwheel
      - name: Build using cibuildwheel
        run: python -m cibuildwheel --output-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
  upload_assets:
    name: "Upload libfranka ${{ matrix.libfranka-version }} release assets"
    needs: [version, build_wheels]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        libfranka-version: ["0.7.1", "0.8.0", "0.9.2", "0.12.1", "0.13.6", "0.14.2", "0.15.0", "0.21.3"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zip-${{ matrix.libfranka-version }}
          path: archive
      # actions/upload-release-asset is archived and unmaintained; the gh CLI is
      # preinstalled on the runner and needs no checkout.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "./archive/panda_py_${{ needs.version.outputs.version }}_libfranka_${{ matrix.libfranka-version }}.zip"
          --repo "${{ github.repository }}" --clobber
